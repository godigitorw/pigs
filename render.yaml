services:
  # Web Service
  - type: web
    name: pigfarm
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python count_db_tables.py && echo 'Database inspection done' && exit 1"
    startCommand: "cd pigfarm && gunicorn pigfarm.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RENDER
        value: true
    autoDeploy: true
