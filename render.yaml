services:
  # Web Service
  - type: web
    name: pigfarm
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "cd pigfarm && gunicorn pigfarm.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: pigfarm-mrz6.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: RENDER
        value: true
    autoDeploy: true
